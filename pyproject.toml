[project]
name = "alttpr-python"
version = "1.0.0"
description = "Python ALttP Randomizer"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "aenum>=3.1.16",
    "aioconsole>=0.6.2",
    "colorama>=0.4.6",
    "distro>=1.9.0",
    "fast-enum>=1.3.0",
    "python-bps-continued>=7",
    "pyyaml>=6.0.1",
    "websockets>=11.0.3",
]

[tool.isort]
profile = "black"
